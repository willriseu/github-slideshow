<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Orosz–magyar szójáték</title>
<style>
  :root {
    --bg: #0f172a;       /* slate-900 */
    --card: #111827;    /* gray-900 */
    --muted: #94a3b8;   /* slate-400 */
    --accent: #22c55e;  /* green-500 */
    --danger: #ef4444;  /* red-500 */
    --primary: #60a5fa; /* blue-400 */
    --btn: #1f2937;     /* gray-800 */
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: radial-gradient(1200px 800px at 10% 10%, #111827, #0b1225), var(--bg);
    color: #e5e7eb;
  }
  .wrap {
    max-width: 980px; margin: 0 auto; padding: 16px;
    display: grid; gap: 16px;
  }
  header {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
  }
  .brand { font-weight: 700; letter-spacing: 0.3px; }
  .score {
    display:flex; gap:12px; font-size: 14px; color: var(--muted);
  }
  .score span b { color:#fff; }
  .card {
    background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
    border: 1px solid rgba(148,163,184,0.18);
    border-radius: 16px; padding: 18px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.35);
  }
  .question {
    font-size: clamp(18px, 4vw, 28px);
    line-height: 1.3; font-weight: 700; margin-bottom: 6px;
  }
  .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 6px; }
  .langpill {
    display:inline-block; padding:4px 10px; border-radius: 999px; font-size:12px;
    background: #0b1020; border:1px solid rgba(148,163,184,0.25); color:#cbd5e1;
    margin-left: 6px;
  }
  .options {
    display: grid; gap: 10px;
    grid-template-columns: repeat(1, minmax(0, 1fr));
  }
  @media (min-width: 640px) { .options { grid-template-columns: repeat(2, minmax(0,1fr)); } }
  .btn {
    background: var(--btn); color: #e5e7eb; border:1px solid rgba(148,163,184,0.22);
    border-radius: 12px; padding: 14px 12px; text-align: left;
    font-size: clamp(14px, 2.4vw, 18px); cursor: pointer; transition: transform .05s ease;
  }
  .btn:active { transform: scale(0.98); }
  .btn.correct { background: #052e1a; border-color: var(--accent); color:#bbf7d0; }
  .btn.wrong   { background: #330b0b; border-color: var(--danger); color:#fecaca; }
  .controls {
    display:flex; gap:10px; align-items:center; justify-content: space-between; margin-top: 10px;
  }
  .timerbar {
    height: 10px; border-radius: 999px; background: #0b1020;
    border:1px solid rgba(148,163,184,0.25); overflow: hidden;
  }
  .timerbar > div {
    height: 100%; background: linear-gradient(90deg, #22c55e, #60a5fa);
    width: 100%; transition: width 0.2s linear;
  }
  .pill {
    padding: 6px 10px; border-radius: 10px; background:#0b1020; border:1px solid rgba(148,163,184,0.25);
    font-size:12px; color:#cbd5e1;
  }
  .primary {
    background:#0b5bd7; border-color:#0b5bd7; color:#fff; cursor:pointer;
  }
  .muted { color: var(--muted); }
  .answerline { margin-top:8px; min-height: 22px; }
  .answerline .ok { color: #86efac; }
  .answerline .bad { color: #fca5a5; }
  footer { text-align:center; color:var(--muted); font-size:12px; padding:8px 0; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">Orosz–magyar szójáték</div>
      <div class="score">
        <span>✅ Helyes: <b id="good">0</b></span>
        <span>❌ Rossz: <b id="bad">0</b></span>
        <span class="pill" title="Megválaszolt / összes">Össz.: <b id="total">0</b> / <b id="all">423</b></span>
      </div>
    </header>

    <div class="card">
      <div class="subtitle">Válaszd ki a helyes választ <span class="langpill" id="langTag"></span></div>
      <div class="question" id="question">Betöltés…</div>

      <div class="options" id="options"></div>

      <div class="controls">
        <div class="timerbar" style="flex:1">
          <div id="timefill"></div>
        </div>
        <button id="next" class="pill primary" disabled>Tovább</button>
      </div>

      <div class="answerline" id="answerline"></div>
    </div>

    <footer>15 másodperc/kérdés • A kérdések vegyesen oroszul és magyarul jönnek.</footer>
  </div>

const state = {
  good: 0, bad: 0, total: 0,
  order: [],
  current: null,
  direction: 'HU2RU', // or 'RU2HU'
  options: [],
  timer: null,
  timeLeft: 15,
  lock: false
};

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function sample(arr, k, excludeIndex=null) {
  const idxs = Array.from(arr.keys());
  if (excludeIndex!==null) idxs.splice(excludeIndex,1);
  shuffle(idxs);
  return idxs.slice(0,k).map(i=>arr[i]);
}

function init() {
  state.order = shuffle([...DATA.keys()]);
  document.getElementById('good').textContent = state.good;
  document.getElementById('bad').textContent = state.bad;
  document.getElementById('total').textContent = state.total;
  nextQuestion();
}

function nextQuestion() {
  if (state.timer) clearInterval(state.timer);
  state.lock = false;
  document.getElementById('answerline').innerHTML = '';
  document.getElementById('next').disabled = true;

  if (state.order.length === 0) {
    state.order = shuffle([...DATA.keys()]); // recycle so you can play indefinitely
  }
  const idx = state.order.pop();
  const item = DATA[idx];
  state.current = { idx, item };

  // Randomly decide direction and number of options (4 or 5)
  state.direction = Math.random() < 0.5 ? 'HU2RU' : 'RU2HU';
  const optCount = Math.random() < 0.5 ? 4 : 5;

  const questionText = state.direction === 'HU2RU' ? item.hu : item.ru;
  const correct = state.direction === 'HU2RU' ? item.ru : item.hu;

  // Build options
  const wrongPool = DATA.filter((_,i)=>i!==idx).map(x => state.direction==='HU2RU' ? x.ru : x.hu);
  shuffle(wrongPool);
  const options = [correct, ...wrongPool.slice(0, optCount-1)];
  shuffle(options);
  state.options = options;

  // Render
  document.getElementById('langTag').textContent = state.direction==='HU2RU' ? 'Kérdés: MAGYAR → Válasz: OROSZ' : 'Kérdés: OROSZ → Válasz: MAGYAR';
  document.getElementById('question').textContent = questionText;
  const optsEl = document.getElementById('options');
  optsEl.innerHTML = '';
  options.forEach((opt) => {
    const btn = document.createElement('button');
    btn.className = 'btn';
    btn.textContent = opt;
    btn.onclick = () => selectAnswer(btn, opt, correct);
    optsEl.appendChild(btn);
  });

  // Timer
  state.timeLeft = 15;
  const fill = document.getElementById('timefill');
  fill.style.width = '100%';
  state.timer = setInterval(() => {
    state.timeLeft -= 0.2;
    const pct = Math.max(0, Math.min(100, (state.timeLeft/15)*100));
    fill.style.width = pct + '%';
    if (state.timeLeft <= 0) {
      clearInterval(state.timer);
      timeout(correct);
    }
  }, 200);
}

function selectAnswer(btn, chosen, correct) {
  if (state.lock) return;
  state.lock = true;
  clearInterval(state.timer);

  const buttons = Array.from(document.querySelectorAll('.btn'));
  buttons.forEach(b => b.disabled = true);

  if (chosen === correct) {
    btn.classList.add('correct');
    state.good += 1;
    document.getElementById('answerline').innerHTML = `<span class="ok">✅ Helyes!</span>`;
  } else {
    btn.classList.add('wrong');
    // highlight the correct one
    buttons.find(b => b.textContent === correct)?.classList.add('correct');
    state.bad += 1;
    document.getElementById('answerline').innerHTML = `<span class="bad">❌ Nem jó.</span> Helyes: <b>{correct}</b>`;
  }
  state.total += 1;
  document.getElementById('good').textContent = state.good;
  document.getElementById('bad').textContent = state.bad;
  document.getElementById('total').textContent = state.total;
  document.getElementById('next').disabled = false;
}

function timeout(correct) {
  if (state.lock) return;
  state.lock = true;
  const buttons = Array.from(document.querySelectorAll('.btn'));
  buttons.forEach(b => b.disabled = true);
  buttons.find(b => b.textContent === correct)?.classList.add('correct');
  state.bad += 1;
  state.total += 1;
  document.getElementById('bad').textContent = state.bad;
  document.getElementById('total').textContent = state.total;
  document.getElementById('answerline').innerHTML = `<span class="bad">⏱ Lejárt az idő!</span> Helyes: <b>{correct}</b>`;
  document.getElementById('next').disabled = false;
}

document.getElementById('next').addEventListener('click', nextQuestion);
window.addEventListener('load', init);
</script>
